name: Build Bunker URL Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Build Release APK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/Bunker-Url-Test-v1.1.0.apk || cp app/build/outputs/apk/debug/*.apk release-apk/Bunker-Url-Test-v1.1.0.apk
          ls -la release-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bunker-Url-Test-v1.1.0
          path: release-apk/*.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.0"
          name: "Bunker URL Test v1.1.0 — Live Network & TSPU Monitor"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apk/*.apk
          body: |
            🛡️ **BUNKER URL TEST v1.1.0 — Реконструированный и улучшенный монитор доступности сети**
            
            ### ⚡ Что нового и исправлено в v1.1.0:
            - **Полноценная реконструкция:** Приложение полностью декомпилировано, очищено от мусора и пересобрано на современном Android Gradle стеке (SDK 35, Java 17/21, Coroutines, WorkManager).
            - **Устранён критический краш на Android 14–17:** В Foreground Service исправлен пустой `foregroundServiceType=""` на `specialUse`, вызывавший `MissingForegroundServiceTypeException`.
            - **Улучшенный выбор приложений (Searchable App Picker):** Вместо громоздкого диалога на 200+ приложений добавлен мгновенный поиск, фильтрация и кнопки «Выбрать все» / «Сбросить».
            - **Защита от сбоев Resource NotFound:** Добавлена безопасная обработка меток пакетов и системных stub-приложений.
            - **Адаптивные таймауты сети (3500 мс):** Предотвращены ложные срабатывания «НЕТ ДОСТУПА» на мобильных операторах при медленном TLS-хэндшейке.
            - **Расширенная база сервисов:** Встроены цели Discord, ChatGPT, Steam, Spotify, X/Twitter, Cloudflare и более 50 профилей приложений.
            - **Виджет и шторка (Quick Settings Tile):** Автономный мониторинг статуса сети прямо с домашнего экрана и панели быстрых настроек.
