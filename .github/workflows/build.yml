name: Build Bunker URL Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Build Release APK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apk
          TAG_NAME="${GITHUB_REF_NAME:-v1.1.2}"
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "release-apk/Bunker-Url-Test-${TAG_NAME}-universal.apk"
          cp "$APK_FILE" "release-apk/Bunker-Url-Test-${TAG_NAME}.apk"
          ls -la release-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bunker-Url-Test-v1.1.2-universal
          path: release-apk/*.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.2' }}
          name: "Bunker URL Test v1.1.2 — Universal Release (V1+V2 Signature & Insets Fix)"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apk/*.apk
          body: |
            🛡️ **BUNKER URL TEST v1.1.2 — Универсальная версия с постоянным ключом подписи и поддержкой V1+V2**
            
            ### ⚡ Что нового в v1.1.2:
            - **Постоянный ключ подписи (Bunker Keystore):** Приложение теперь подписано официальным постоянным ключом с двойной схемой подписи (V1 JAR + V2 Full APK). Все последующие обновления будут устанавливаться «поверх» без конфликтов подписи на любых оболочках (HyperOS, OneUI, ColorOS, EMUI).
            - **Универсальная совместимость (Android 7.0–17):** Минимальная версия снижена до Android 7.0 (`minSdk 24`), поддержаны все типы архитектур (arm64-v8a, armeabi-v7a, x86_64, x86).
            - **Исправлен отступ шторки (Edge-to-Edge Fix):** Шапка больше не перекрывается статус-баром и вырезом камеры, а нижние кнопки не закрываются системной навигацией.
            - **Только 4 ключевых сервиса по умолчанию:** Google, Telegram, Instagram, YouTube.
            - **Параллельная мгновенная проверка:** Все сервисы пингуются одновременно через корутины за доли секунды, зависания при блокировках ТСПУ исключены.
            
            > ⚠️ **Важно при первом переходе:** Если у вас стояла старая тестовая версия (debug), удалите её перед установкой v1.1.2 один раз (так как у старой версии был временный debug-ключ, из-за чего Android блокирует установку поверх). Начиная с v1.1.2, все апдейты будут накатываться поверх автоматически!
