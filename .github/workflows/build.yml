name: Build Bunker URL Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Build Release APK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/Bunker-Url-Test-v1.1.0.apk || cp app/build/outputs/apk/debug/*.apk release-apk/Bunker-Url-Test-v1.1.0.apk
          ls -la release-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bunker-Url-Test-v1.1.1
          path: release-apk/*.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.1' }}
          name: "Bunker URL Test v1.1.1 — Fast Parallel Monitor & Insets Fix"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apk/*.apk
          body: |
            🛡️ **BUNKER URL TEST v1.1.1 — Hotfix: быстрые параллельные проверки и исправление отступов шторки**
            
            ### ⚡ Что исправлено в v1.1.1:
            - **Исправлен отступ шторки и навигационной панели (Edge-to-Edge Fix):** Добавлена правильная обработка `WindowInsets` (`systemBars` и `displayCutout`), благодаря чему заголовок больше не залезает под статус-бар/вырез камеры ("под шторку"), а нижние кнопки не перекрываются системными кнопками навигации.
            - **Только 4 ключевых сервиса по умолчанию:** Список сокращён до 4 самых востребованных (Google, Telegram, Instagram, YouTube). Всё остальное пользователь при желании может добавить через кнопку «Добавить сервис».
            - **Устранена "бесконечная проверка":**
              * Все проверки теперь выполняются **параллельно** через корутины (`async`/`awaitAll`), а не по очереди.
              * Результаты каждого сервиса обновляются на экране **мгновенно** по мере завершения пинга, не дожидаясь остальных.
              * Добавлен строгий таймаут `withTimeoutOrNull` (2500 мс) и заголовок `Connection: close`, исключающий зависание сокетов при блокировке ТСПУ.
              * Убран сброс карточек в «Ожидание проверки…» на каждом 15-секундном цикле — результат сохраняется и плавно обновляется.
